
# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is NOT reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, restart the server.
#
# If you need help with YAML syntax:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/

# Site settings
title: Your awesome title
email: your-email@example.com
description: >-
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
baseurl: ""
url: ""
twitter_username: jekyllrb
github_username: jekyll

# Build settings
theme: minima
plugins:
  - jekyll-feed

# ============================================
# CONTENT COLLECTIONS
# ============================================
# Notes: written posts and observations.
# Projects: substantial projects with their own pages and assets.
#
# _notes/example.md   -> /notes/example/
# _projects/rocks.md  -> /projects/rocks/

collections:
  notes:
    output: true
    permalink: /notes/:name/

  projects:
    output: true
    permalink: /projects/:name/

# ============================================
# DEFAULT FRONT MATTER
# ============================================
defaults:
  # Notes defaults
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
      router: "off"
      section: "notes"

  # Projects defaults
  - scope:
      path: ""
      type: "projects"
    values:
      router: "off"
      section: "projects"

# ============================================
# EXCLUDE FROM PROCESSING
# ============================================
# The following items will not be processed, by default.
# The following paths are automatically excluded by Jekyll.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
