<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>

    <link rel="stylesheet" href="{{ '/assets/css/typography.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>

<body data-baseurl="{{ site.baseurl }}">
    <div class="site-shell">
        {% include nav.html %}
        <main class="content-area" id="content-area">
            {{ content }}
        </main>
    </div>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>

</html>
