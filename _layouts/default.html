<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>

    <link rel="stylesheet" href="{{ '/assets/css/typography.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>

<body data-baseurl="{{ site.baseurl }}">
    <div class="site-shell">
        {% include nav.html %}

        <main class="content-area" id="content-area">
            <div class="text-wrapper">
                <canvas class="highlight-canvas"></canvas>

                {% if content %}
                {{ content }}
                {% else %}
                <section class="content-section">
                    <h1>Shrimplines</h1>
                    <p>Select text here to see the marker highlight...</p>
                </section>
                {% endif %}
            </div>
        </main>
    </div>

    <script src="{{ '/assets/js/highlight.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>

</html>
